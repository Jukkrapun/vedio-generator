<!doctype html>
<html lang="th" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="captions.js"></script>
    <script src="mouth.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.0/lib/three-vrm.module.min.js"
        }
      }
    </script>
    <style>
      @font-face { font-family: "PlexThai"; src: url("assets/font.ttf") format("truetype"); font-display: block; }
      :root { --ground: #05070d; --ink: #f4f1ea; --gold: #ffcf6b; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); font-family: "PlexThai", sans-serif; }
      #root { position: relative; width: 100%; height: 100%; }
      #stage { position: absolute; inset: 0; }
      #stage canvas { width: 1080px !important; height: 1920px !important; display: block; }
      #vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 40%, transparent 50%, rgba(3,5,12,0.65) 100%); }
      #captions { position: absolute; left: 130px; right: 130px; top: 1260px; height: 300px; }
      .card { position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-content: center;
        justify-content: center; text-align: center; opacity: 0; }
      .word { display: inline-block; white-space: pre; color: var(--ink); font-size: 80px; line-height: 1.45;
        text-shadow: 0 0 4px #000, 0 3px 10px rgba(0,0,0,0.85); -webkit-text-stroke: 2px rgba(0,0,0,0.55);
        paint-order: stroke fill; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.4"
         data-width="1080" data-height="1920" data-fps="30">
      <audio src="assets/voice.mp3" data-start="0" data-duration="10.4" data-track-index="5" data-volume="1"></audio>
      <div id="overlay" class="clip" data-start="0" data-duration="10.4" data-track-index="1">
        <div id="stage"></div>
        <div id="vignette"></div>
        <div id="captions"></div>
      </div>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { VRMLoaderPlugin, VRMUtils } from "@pixiv/three-vrm";

      const DUR = 10.4, SCENE2 = 5.167;
      const M = window.MOUTH;

      // ---------- renderer / scene ----------
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1080, 1920, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.getElementById("stage").appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a1024);
      const camera = new THREE.PerspectiveCamera(28, 1080 / 1920, 0.05, 50);

      scene.add(new THREE.HemisphereLight(0x5b6fb0, 0x0a0c18, 1.2));
      const moon = new THREE.DirectionalLight(0x9db8ff, 1.4); moon.position.set(1.5, 2.5, 1.5); scene.add(moon);
      const lamp = new THREE.PointLight(0xffa64d, 3, 4, 1.5); lamp.position.set(-0.9, 1.5, 0.6); scene.add(lamp);
      const phoneLight = new THREE.PointLight(0xa9c8ff, 0, 1.2, 1.5); phoneLight.position.set(0, 1.05, 0.45); scene.add(phoneLight);

      // simple bedroom backdrop
      const mat = (c, e = 0) => new THREE.MeshLambertMaterial({ color: c, emissive: c, emissiveIntensity: e });
      const box = (w, h, d, c, p, e) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(c, e)); m.position.set(...p); scene.add(m); return m; };
      box(8, 6, 0.1, 0x151d3d, [0, 2, -1.2]);                         // wall
      box(0.9, 1.2, 0.02, 0x22346e, [0.75, 1.75, -1.14], 0.5);       // window glow
      box(0.95, 0.03, 0.04, 0x2a3352, [0.75, 1.75, -1.12]);
      box(0.03, 1.25, 0.04, 0x2a3352, [0.75, 1.75, -1.12]);
      const moonDisc = new THREE.Mesh(new THREE.CircleGeometry(0.11, 32), new THREE.MeshBasicMaterial({ color: 0xfff2c4 }));
      moonDisc.position.set(0.95, 2.05, -1.12); scene.add(moonDisc);
      box(0.35, 0.45, 0.35, 0xffb860, [-0.85, 1.35, -0.6], 1.0);     // lamp shade
      box(1.6, 0.5, 1.2, 0x2b3766, [0, 0.55, -0.4]);                  // pillow/headboard area

      // seeded dust
      let seed = 20261125;
      const rand = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
      const motes = [];
      for (let i = 0; i < 30; i++) {
        const m = new THREE.Mesh(new THREE.SphereGeometry(0.004, 6, 4), new THREE.MeshBasicMaterial({ color: 0xffe2b0, transparent: true }));
        m.position.set((rand() - 0.5) * 1.2, 1.0 + rand() * 0.9, -0.6 + rand() * 1.0);
        scene.add(m); motes.push({ m, y0: m.position.y, sp: 0.01 + rand() * 0.02, ph: rand() * 6.28 });
      }

      // tell the HyperFrames runtime to wait for the async model load before capturing
      let markReady;
      const ready = new Promise((r) => (markReady = r));
      if (window.__hyperframes?.registerFrameSource) {
        window.__hyperframes.registerFrameSource({
          element: document.getElementById("stage"), ready,
          render: () => {},          // drawing is driven by the GSAP clock below
          dispose: () => renderer.dispose(),
        });
      } else {
        console.warn("registerFrameSource not available");
      }

      // ---------- load VRM (must finish before the timeline is registered) ----------
      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));
      const gltf = await loader.loadAsync("assets/model.vrm");
      const vrm = gltf.userData.vrm;
      VRMUtils.removeUnnecessaryVertices(gltf.scene);
      VRMUtils.rotateVRM0(vrm);            // no-op for VRM 1.0
      vrm.springBoneManager?.reset?.();
      scene.add(vrm.scene);

      const bone = (n) => vrm.humanoid.getNormalizedBoneNode(n);
      const B = Object.fromEntries(["hips", "spine", "chest", "neck", "head",
        "leftUpperArm", "rightUpperArm", "leftLowerArm", "rightLowerArm", "leftHand", "rightHand"].map((n) => [n, bone(n)]));
      const headY = B.head.getWorldPosition(new THREE.Vector3()).y;
      const EX = vrm.expressionManager;
      const VIS = ["aa", "ih", "ou", "ee", "oh"];

      const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
      const BLINKS = [1.7, 4.0, 6.3, 7.1, 9.2];

      function draw(t) {
        const s2 = t >= SCENE2;
        const tt = s2 ? t - SCENE2 : t;
        const up = smooth(SCENE2, SCENE2 + 0.8, t);

        // camera: scene 1 = close-up from slightly above, slow push in; scene 2 = lower angle, wider
        if (!s2) {
          camera.position.set(0.05 * Math.sin(t * 0.3), headY + 0.18, 1.75 - tt * 0.05);
          camera.lookAt(0, headY - 0.22, 0);
        } else {
          camera.position.set(-0.35 + tt * 0.02, headY - 0.12, 1.85 - tt * 0.04);
          camera.lookAt(0.02, headY - 0.12, 0);
        }

        // pose: arms down, forearms bent forward as if holding a phone in scene 1
        const breath = Math.sin(t * 2.0);
        B.leftUpperArm.rotation.set(0, 0, -1.2 + breath * 0.01);
        B.rightUpperArm.rotation.set(0, 0, 1.2 - breath * 0.01);
        const hold = 1 - up;
        B.leftLowerArm.rotation.set(0, 1.5 * hold, 0);
        B.rightLowerArm.rotation.set(0, -1.5 * hold, 0);
        B.chest.rotation.x = breath * 0.015;
        B.spine.rotation.x = 0.05 * hold;
        // head: looking down at the phone -> looking up at the ceiling
        B.neck.rotation.x = 0.18 * hold - 0.18 * up;
        B.head.rotation.x = 0.12 * hold - 0.22 * up;
        B.head.rotation.z = Math.sin(t * 0.7) * 0.04;

        // expressions
        let blink = 0;
        for (const b of BLINKS) blink = Math.max(blink, 1 - Math.abs(t - b) / 0.09);
        EX.setValue("relaxed", 0.55 * hold);    // sleepy eyes
        EX.setValue("sad", 0.55 * up);          // worried
        EX.setValue("blink", Math.max(0, blink));
        const f = Math.min(M.open.length - 1, Math.floor(t * M.fps));
        VIS.forEach((v) => EX.setValue(v, 0));
        EX.setValue(M.vis[f], Math.min(1, M.open[f] * 0.95));

        phoneLight.intensity = (0.25 + Math.sin(t * 9) * 0.02) * hold;
        motes.forEach((d) => {
          d.m.position.y = d.y0 + ((t * d.sp) % 0.6);
          d.m.material.opacity = 0.3 + 0.3 * Math.sin(t * 1.3 + d.ph);
        });

        vrm.humanoid.update();
        EX.update();
        vrm.nodeConstraintManager?.update();
        renderer.render(scene, camera);
      }

      // ---------- timeline ----------
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(clock.t) }, 0);

      const capBox = document.getElementById("captions");
      window.EPISODE.segments.filter((s) => s.start < DUR).forEach((seg) => {
        seg.cards.forEach((card) => {
          const el = document.createElement("div"); el.className = "card";
          const spans = card.words.map((w) => {
            const s = document.createElement("span"); s.className = "word"; s.textContent = w.text; el.appendChild(s); return s;
          });
          capBox.appendChild(el);
          tl.set(el, { opacity: 1 }, card.start - 0.01).set(el, { opacity: 0 }, Math.min(card.end, DUR - 0.05));
          card.words.forEach((w, i) => {
            const next = i + 1 < card.words.length ? card.words[i + 1].t : card.end;
            tl.fromTo(spans[i], { opacity: 0, y: 24, filter: "blur(8px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.3, ease: "power3.out", immediateRender: false }, w.t);
            tl.fromTo(spans[i], { color: "#ffcf6b" }, { color: "#f4f1ea", duration: 0.35, immediateRender: false }, Math.max(w.t + 0.1, next - 0.05));
          });
        });
      });

      draw(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
      markReady();
    </script>
  </body>
</html>
